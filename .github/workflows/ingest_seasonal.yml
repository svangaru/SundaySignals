name: Ingest Seasonal

on:
  schedule:
    # March 1 at 6am UTC — captures final stats from the previous season
    - cron: "0 6 1 3 *"
    # August 1 at 6am UTC — captures OC/QB/roster changes before Week 1
    - cron: "0 6 1 8 *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Space-separated seasons to ingest (e.g. 2023 2024). Leave blank for default (2020–current)."
        required: false
        default: ""

jobs:
  ingest:
    name: Build seasonal features and upsert to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest_seasonal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.seasons }}" ]; then
            python pipelines/ingest_seasonal.py --seasons ${{ github.event.inputs.seasons }} --context-flags overrides/context_flags.csv
          else
            python pipelines/ingest_seasonal.py --context-flags overrides/context_flags.csv
          fi
