name: Retrain Weekly

on:
  # Triggered automatically when ingest_weekly succeeds
  workflow_run:
    workflows: ["Ingest Weekly"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      train_seasons:
        description: "Space-separated train seasons (e.g. 2020 2021 2022 2023). Leave blank for default."
        required: false
        default: ""
      predict_season:
        description: "Season to generate predictions for (e.g. 2024). Leave blank for default."
        required: false
        default: ""
      predict_week:
        description: "Specific week to score (e.g. 12). Leave blank to score all weeks."
        required: false
        default: ""

jobs:
  retrain:
    name: Train weekly XGBoost model and write predictions
    # Only run if triggered manually, or if the upstream ingest succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train weekly model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.train_seasons }}" ]; then
            ARGS="$ARGS --train-seasons ${{ github.event.inputs.train_seasons }}"
          fi
          if [ -n "${{ github.event.inputs.predict_season }}" ]; then
            ARGS="$ARGS --predict-season ${{ github.event.inputs.predict_season }}"
          fi
          if [ -n "${{ github.event.inputs.predict_week }}" ]; then
            ARGS="$ARGS --predict-week ${{ github.event.inputs.predict_week }}"
          fi
          python pipelines/train_weekly.py $ARGS
